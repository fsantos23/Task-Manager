services:
  postgres_db:
    image: postgres:18
    environment: 
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - task_manager

  backend:
    build: ./backend
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - task_manager
    volumes:
    # development only
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    expose:
      - 3000
    ports:
      - "3000:3000"
    networks:
      - task_manager
    volumes:
    # development only
      - ./frontend:/app

networks:
  task_manager:
    driver: bridge

volumes:
  postgres_data:
